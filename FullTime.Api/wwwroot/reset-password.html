<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullTime — Reset Password</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
  <div class="brand">
    <img class="brand-crest" src="logo.png" alt="">
    <span class="wordmark"><span class="full">FULL</span><span class="dot">&bull;</span><span class="time">TIME</span></span>
  </div>

  <main class="card">
    <h1>Reset password</h1>
    <form id="reset-form">
      <label for="password">New password</label>
      <input type="password" id="password" minlength="8" autocomplete="new-password" required>

      <label for="confirm-password">Confirm new password</label>
      <input type="password" id="confirm-password" minlength="8" autocomplete="new-password" required>

      <button type="submit">Reset password</button>
    </form>
    <div id="status" class="status"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JTM Technology. Not a real-money gambling product.</p>
    <p><a href="https://fulltime.jtmtechnology.co.uk/privacy.html">Privacy Policy</a></p>
  </footer>

<script>
const form = document.getElementById('reset-form');
const statusEl = document.getElementById('status');
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  form.style.display = 'none';
  statusEl.textContent = 'No reset token in the link.';
  statusEl.className = 'status error';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (password !== confirmPassword) {
    statusEl.textContent = 'Passwords do not match.';
    statusEl.className = 'status error';
    return;
  }

  statusEl.textContent = 'Resetting…';
  statusEl.className = 'status muted';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: password }),
    });
    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(body.error || `Request failed: ${res.status}`);
    }

    form.style.display = 'none';
    statusEl.textContent = 'Password reset! Head back to the FullTime app and log in with your new password.';
    statusEl.className = 'status success';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
  }
});
</script>
</body>
</html>
