<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FullTime — Forgot Password</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  #auth-nav { margin-bottom: 1.5rem; font-size: 0.9rem; }
  label { display: block; margin-top: 1rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-top: 1.5rem; cursor: pointer; }
  .status { margin-top: 1rem; font-size: 0.9rem; color: #555; }
  .error { color: #b00020; }
  .muted { color: #888; }
</style>
</head>
<body>
  <div id="auth-nav"></div>
  <h1>Forgot password</h1>
  <p class="muted">Enter your email and, if it's registered, a reset link will be sent (logged to the server console during local/dev use).</p>
  <form id="forgot-form">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <button type="submit">Send reset link</button>
  </form>
  <div id="status" class="status"></div>

<script src="auth.js"></script>
<script>
const form = document.getElementById('forgot-form');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  statusEl.textContent = 'Sending…';
  statusEl.className = 'status';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(body.error || `Request failed: ${res.status}`);
    }

    statusEl.textContent = body.message || 'If that email is registered, a reset link has been sent.';
    statusEl.className = 'status';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
  }
});
</script>
</body>
</html>
