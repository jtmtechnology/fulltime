<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullTime — Forgot Password</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
  <div class="brand">
    <img class="brand-crest" src="logo.png" alt="">
    <span class="wordmark"><span class="full">FULL</span><span class="dot">&bull;</span><span class="time">TIME</span></span>
  </div>

  <main class="card">
    <h1>Forgot password</h1>
    <p class="muted">Enter your email and, if it's registered, we'll send you a link to reset your password.</p>
    <form id="forgot-form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <button type="submit">Send reset link</button>
    </form>
    <div id="status" class="status"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JTM Technology. Not a real-money gambling product.</p>
    <p><a href="https://fulltime.jtmtechnology.co.uk/privacy.html">Privacy Policy</a></p>
  </footer>

<script>
const form = document.getElementById('forgot-form');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  statusEl.textContent = 'Sending…';
  statusEl.className = 'status muted';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(body.error || `Request failed: ${res.status}`);
    }

    statusEl.textContent = body.message || 'If that email is registered, a reset link has been sent.';
    statusEl.className = 'status success';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
  }
});
</script>
</body>
</html>
