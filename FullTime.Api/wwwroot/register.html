<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FullTime — Register</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  #auth-nav { margin-bottom: 1.5rem; font-size: 0.9rem; }
  label { display: block; margin-top: 1rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-top: 1.5rem; cursor: pointer; }
  .status { margin-top: 1rem; font-size: 0.9rem; color: #555; }
  .error { color: #b00020; }
  .muted { color: #888; }
</style>
</head>
<body>
  <div id="auth-nav"></div>
  <h1>Register</h1>
  <form id="register-form">
    <label for="name">Name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" minlength="8" required>

    <label for="confirm-password">Confirm password</label>
    <input type="password" id="confirm-password" minlength="8" required>

    <button type="submit">Register</button>
  </form>
  <div id="status" class="status"></div>

<script src="auth.js"></script>
<script>
const form = document.getElementById('register-form');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (password !== confirmPassword) {
    statusEl.textContent = 'Passwords do not match.';
    statusEl.className = 'status error';
    return;
  }

  statusEl.textContent = 'Registering…';
  statusEl.className = 'status';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(body.error || `Request failed: ${res.status}`);
    }

    form.style.display = 'none';
    statusEl.textContent = 'Registered! Check the server log for a verification link (email sending isn’t wired up to a real inbox yet), then visit it to verify your account before logging in.';
    statusEl.className = 'status';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
  }
});
</script>
</body>
</html>
