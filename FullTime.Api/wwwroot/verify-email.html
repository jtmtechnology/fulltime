<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullTime — Verify Email</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
  <div class="brand">
    <img class="brand-crest" src="logo.png" alt="">
    <span class="wordmark"><span class="full">FULL</span><span class="dot">&bull;</span><span class="time">TIME</span></span>
  </div>

  <main class="card">
    <h1>Verify email</h1>
    <div id="status" class="status muted">Verifying…</div>
    <div id="resend-container" style="display:none">
      <label for="resend-email">Email</label>
      <input type="email" id="resend-email" autocomplete="email">
      <button id="resend-btn" type="button">Resend verification email</button>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JTM Technology. Not a real-money gambling product.</p>
    <p><a href="https://fulltime.jtmtechnology.co.uk/privacy.html">Privacy Policy</a></p>
  </footer>

<script>
const statusEl = document.getElementById('status');
const resendContainer = document.getElementById('resend-container');
const resendBtn = document.getElementById('resend-btn');

const token = new URLSearchParams(window.location.search).get('token');

async function verify() {
  if (!token) {
    statusEl.textContent = 'No verification token in the link.';
    statusEl.className = 'status error';
    resendContainer.style.display = '';
    return;
  }

  try {
    const res = await fetch('/api/auth/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(body.error || `Request failed: ${res.status}`);
    }

    statusEl.textContent = 'Email verified! Head back to the FullTime app and log in.';
    statusEl.className = 'status success';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
    resendContainer.style.display = '';
  }
}

resendBtn.addEventListener('click', async () => {
  const email = document.getElementById('resend-email').value.trim();
  if (!email) return;

  resendBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/resend-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const body = await res.json().catch(() => ({}));
    statusEl.textContent = body.message || 'If that account exists and isn’t verified yet, a new email has been sent.';
    statusEl.className = 'status muted';
  } finally {
    resendBtn.disabled = false;
  }
});

verify();
</script>
</body>
</html>
