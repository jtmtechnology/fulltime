workflows:
  android-debug:
    name: FullTime Android Debug
    max_build_duration: 60
    environment:
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
    scripts:
      - name: Install .NET SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir $DOTNET_PATH

      - name: Install MAUI Android workload
        script: |
          $DOTNET workload install maui-android

      - name: Install Android SDK platform
        script: |
          # The maui-android workload only brings the build tooling, not the actual Android SDK
          # platform files (android.jar etc for the target API level) - those are a separate
          # download, hence XA5207 "Could not find android.jar for API level ..." without this.
          # AcceptAndroidSDKLicenses is required non-interactively in CI (no terminal to accept the
          # licence prompt).
          #
          # AndroidOnlyBuild=true (FullTime.App.csproj) collapses this project down to just the
          # net10.0-android TFM - same reason the ios-ad-hoc/ios-testflight workflows below pass
          # IosOnlyBuild=true, and for the same reason: this runner only has the maui-android
          # workload installed, not ios/maccatalyst's, and the full multi-target list needs all of
          # them just to *restore*, let alone build. A command-line -p:TargetFramework=net10.0-android
          # override was tried first instead of this - don't reintroduce it, it's a global MSBuild
          # property that also propagates into FullTime.App.Shared's own restore, wrongly forcing
          # its single real TargetFramework and corrupting its assets file (NETSDK1005 on the next
          # --no-restore step, "doesn't have a target for 'net10.0'"). AndroidOnlyBuild is scoped to
          # this project only, so it can't do that.
          cd FullTime.App/FullTime.App
          $DOTNET build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidOnlyBuild=true \
            -p:AndroidSdkDirectory=/usr/local/share/android-sdk \
            -p:AcceptAndroidSDKLicenses=true

      - name: Build a directly-installable debug APK
        script: |
          # EmbedAssembliesIntoApk sidesteps Fast Deploy (which needs the IDE/adb to push
          # assemblies separately) - same reason it's used for local emulator installs, see
          # HANDOVER.md. Auto-signed with the default debug keystore, which is fine for sideloading
          # onto a personal device but NOT what would ship to the Play Store.
          cd FullTime.App/FullTime.App
          $DOTNET build -f net10.0-android -c Debug -p:AndroidOnlyBuild=true -p:EmbedAssembliesIntoApk=true

    artifacts:
      - FullTime.App/FullTime.App/bin/Debug/net10.0-android/*-Signed.apk

    publishing:
      email:
        recipients:
          - alan@jtmtechnology.co.uk

  ios-ad-hoc:
    name: FullTime iOS Ad Hoc
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FullTime
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.jtmtechnology.fulltime.app
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
    scripts:
      - name: Install .NET SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir $DOTNET_PATH

      - name: Install MAUI iOS workload
        script: |
          $DOTNET workload install maui-ios

      - name: Build and sign the ad-hoc IPA
        script: |
          CERT_NAME=$(keychain list-certificates | jq -r '.[0].common_name')
          PROFILE_NAME=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
            -name "*.mobileprovision" -execdir sh -c \
            '/usr/libexec/PlistBuddy -c "print :Name" /dev/stdin <<< $(security cms -D -i "$1")' _ {} \; | head -1)

          cd FullTime.App/FullTime.App
          $DOTNET publish -f net10.0-ios \
            -c Release \
            -p:IosOnlyBuild=true \
            -p:BuildIpa=true \
            -p:ApplicationDisplayVersion="1.0.0" \
            -p:ApplicationVersion=$BUILD_NUMBER \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME"

    artifacts:
      - FullTime.App/FullTime.App/bin/Release/net10.0-ios/**/*.ipa

    publishing:
      email:
        recipients:
          - alan@jtmtechnology.co.uk

  ios-testflight:
    name: FullTime iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FullTime
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jtmtechnology.fulltime.app
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
    scripts:
      - name: Install .NET SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir $DOTNET_PATH

      - name: Install MAUI iOS workload
        script: |
          $DOTNET workload install maui-ios

      - name: Build and sign for App Store
        script: |
          CERT_NAME=$(keychain list-certificates | jq -r '.[0].common_name')
          PROFILE_NAME=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
            -name "*.mobileprovision" -execdir sh -c \
            '/usr/libexec/PlistBuddy -c "print :Name" /dev/stdin <<< $(security cms -D -i "$1")' _ {} \; | head -1)

          cd FullTime.App/FullTime.App
          $DOTNET publish -f net10.0-ios \
            -c Release \
            -p:IosOnlyBuild=true \
            -p:BuildIpa=true \
            -p:ApplicationDisplayVersion="1.0.0" \
            -p:ApplicationVersion=$BUILD_NUMBER \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME"

    artifacts:
      - FullTime.App/FullTime.App/bin/Release/net10.0-ios/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
